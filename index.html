<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tesla Dashboard v2.14</title>

<style>
 * {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
}

/*
    iPhone 11 Pro Max landscape:
    ca. 896 x 414 CSS pixels.

    Hele skærmen bruges som instrumentpanel.
*/
.dashboard {
    width: 100vw;
    height: 100dvh;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 250px;
    grid-template-rows: 1fr auto;

    align-items: center;

    padding-top: max(6px, env(safe-area-inset-top));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
}

/* -------------------------
   SPEEDOMETER
-------------------------- */

.gauge {
    position: relative;

    width: min(100%, 400px);
    aspect-ratio: 1 / 1;

    justify-self: center;
    align-self: center;
}

svg {
    width: 100%;
    height: 100%;
    display: block;
}

.dial {
    fill: #17232c;
    stroke: #56636c;
    stroke-width: 3;
}

.tick {
    stroke: #89949b;
    stroke-width: 2;
}

.tick.major {
    stroke: white;
    stroke-width: 4;
}

.speed-label {
    fill: white;
    font-size: 18px;
    text-anchor: middle;
    dominant-baseline: middle;
}

#needle {
    stroke: #ff453a;
    stroke-width: 7;
    stroke-linecap: round;
    transform-origin: 250px 250px;
    transition: transform 0.15s linear;
}

.needle-center {
    fill: #ddd;
    stroke: #444;
    stroke-width: 3;
}

/* Digital hastighed inde i uret */

.digital {
    position: absolute;
    left: 0;
    right: 0;
    top: 57%;
    text-align: center;
}

#speed {
    font-size: clamp(55px, 10vw, 82px);
    font-weight: bold;
    line-height: 0.9;
}

.unit {
    margin-top: 8px;
    font-size: 20px;
    color: #aaa;
}

/* -------------------------
   INFORMATIONSPANEL
-------------------------- */

.diagnostics {
    width: 100%;

    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;

    padding-left: 10px;
}

.diagnostic {
    background: #17232c;
    border: 1px solid #263640;
    border-radius: 9px;

    padding: 8px 6px;
    min-height: 64px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.diagnostic .label {
    font-size: 12px;
    color: #89949b;
}

.diagnostic .value {
    margin-top: 4px;
    font-size: 19px;
    font-weight: 500;
}

/* GPS status */

#status {
    grid-column: 2;
    grid-row: 2;

    margin: 3px 0 0 10px;

    color: #89949b;
    font-size: 12px;
    text-align: center;
}


/*
    Specielt til telefoner i landscape.
    Herunder iPhone 11 Pro Max.
*/
@media (orientation: landscape) and (max-height: 430px) {

    .dashboard {
        grid-template-columns: minmax(0, 1fr) 245px;
    }

    .gauge {
        width: min(100%, 395px);
    }

    .diagnostics {
        gap: 6px;
    }

    .diagnostic {
        min-height: 61px;
        padding: 6px;
    }
}
</style>
</head>

<body>

<div class="dashboard">

    <div class="gauge">

        <svg viewBox="0 0 500 500">

            <circle class="dial"
                    cx="250"
                    cy="250"
                    r="220"/>

            <g id="ticks"></g>

            <line id="needle"
                  x1="250"
                  y1="250"
                  x2="250"
                  y2="75"/>

            <circle class="needle-center"
                    cx="250"
                    cy="250"
                    r="13"/>

        </svg>

        <div class="digital">
            <div id="speed">0</div>
            <div class="unit">km/t</div>
        </div>

    </div>

    <div class="diagnostics">

        <div class="diagnostic">
            <div class="label">Nøjagtighed</div>
            <div class="value" id="accuracy">--</div>
        </div>

        <div class="diagnostic">
            <div class="label">Retning</div>
            <div class="value" id="heading">--</div>
        </div>

        <div class="diagnostic">
            <div class="label">Opdatering</div>
            <div class="value" id="interval">--</div>
        </div>

        <div class="diagnostic">
            <div class="label">Acceleration</div>
            <div class="value" id="acceleration">--</div>
        </div>

    </div>

    <div id="status">Venter på GPS...</div>

</div>

<script>

const MAX_SPEED = 160;

// Speedometer går fra -130° til +130°
const MIN_ANGLE = -130;
const MAX_ANGLE = 130;

const speedElement =
    document.getElementById("speed");

const needle =
    document.getElementById("needle");

const accuracyElement =
    document.getElementById("accuracy");

const headingElement =
    document.getElementById("heading");

const intervalElement =
    document.getElementById("interval");

const accelerationElement =
    document.getElementById("acceleration");

const statusElement =
    document.getElementById("status");

let previousSpeed = null;
let previousTime = null;

// Bruges separat til accelerationsmåling
let accelerationSpeed = null;
let accelerationTime = null;

/* -----------------------------
   Tegn speedometerets skala
------------------------------ */

const ticks = document.getElementById("ticks");

function polarPoint(angle, radius) {

    const radians =
        (angle - 90) * Math.PI / 180;

    return {
        x: 250 + radius * Math.cos(radians),
        y: 250 + radius * Math.sin(radians)
    };
}


for (let speed = 0; speed <= MAX_SPEED; speed += 5) {

    const fraction = speed / MAX_SPEED;

    const angle =
        MIN_ANGLE +
        fraction * (MAX_ANGLE - MIN_ANGLE);

    const major = speed % 20 === 0;

    const outer = polarPoint(angle, 205);

    const inner = polarPoint(
        angle,
        major ? 180 : 190
    );

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute("x1", inner.x);
    line.setAttribute("y1", inner.y);
    line.setAttribute("x2", outer.x);
    line.setAttribute("y2", outer.y);

    line.setAttribute(
        "class",
        major ? "tick major" : "tick"
    );

    ticks.appendChild(line);


    if (major) {

        const labelPosition =
            polarPoint(angle, 155);

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        text.setAttribute(
            "x",
            labelPosition.x
        );

        text.setAttribute(
            "y",
            labelPosition.y
        );

        text.setAttribute(
            "class",
            "speed-label"
        );

        text.textContent = speed;

        ticks.appendChild(text);
    }
}


/* -----------------------------
   Opdater speedometer
------------------------------ */

function setSpeed(kmh) {

    kmh = Math.max(
        0,
        Math.min(MAX_SPEED, kmh)
    );

    speedElement.textContent =
        Math.round(kmh);

    const fraction =
        kmh / MAX_SPEED;

    const angle =
        MIN_ANGLE +
        fraction *
        (MAX_ANGLE - MIN_ANGLE);

    needle.style.transform =
        `rotate(${angle}deg)`;
}


/* -----------------------------
   GPS
------------------------------ */

if (!navigator.geolocation) {
    statusElement.textContent =
        "Browseren understøtter ikke GPS";
} else {
    navigator.geolocation.watchPosition(
        position => {
            const c = position.coords;
            const now = position.timestamp;
            let kmh = 0;
            if (c.speed !== null) {
                kmh = c.speed * 3.6;
            }
            setSpeed(kmh);
            // GPS accuracy
            accuracyElement.textContent =
                Math.round(c.accuracy) + " m";

            // Heading
            if (c.heading !== null) {
                headingElement.textContent =
                    Math.round(c.heading) + "°";
            } else {
                headingElement.textContent =
                    "--";
            }

            // Update interval
            if (previousTime !== null) {
                const milliseconds = now - previousTime;
                intervalElement.textContent = Math.round(milliseconds) + " ms";
            }

            // Acceleration
            // Acceleration beregnet over mindst 1 sekund

            if (accelerationTime === null) {
                accelerationTime = now;
                accelerationSpeed = kmh;
            } else {
                const elapsed = (now - accelerationTime) / 1000;
                if (elapsed >= 1.0) {
                    const currentMS = kmh / 3.6;
                    const oldMS = accelerationSpeed / 3.6;
                    const acceleration = (currentMS - oldMS) / elapsed;
                    accelerationElement.textContent = acceleration.toFixed(2) + " m/s²";
                    accelerationTime = now;
                    accelerationSpeed = kmh;
                }
            }

            previousSpeed = kmh;
            previousTime = now;

            statusElement.textContent =
                "GPS aktiv";
        },
        error => {
            statusElement.textContent =
                "GPS fejl: " +
                error.message;
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
}

</script>

</body>
</html>
